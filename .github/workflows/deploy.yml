name: Deploy to Vercel

on:
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Set SMTP Environment Variables
        run: |
          # Remove existing SMTP vars (ignore errors if they don't exist)
          for VAR in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM; do
            echo "y" | vercel env rm "$VAR" production --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
          done
          # Add SMTP vars
          echo "${{ secrets.SMTP_HOST }}" | vercel env add SMTP_HOST production --token=${{ secrets.VERCEL_TOKEN }}
          echo "${{ secrets.SMTP_PORT }}" | vercel env add SMTP_PORT production --token=${{ secrets.VERCEL_TOKEN }}
          echo "${{ secrets.SMTP_USER }}" | vercel env add SMTP_USER production --token=${{ secrets.VERCEL_TOKEN }}
          echo "${{ secrets.SMTP_PASS }}" | vercel env add SMTP_PASS production --token=${{ secrets.VERCEL_TOKEN }}
          echo "${{ secrets.SMTP_FROM }}" | vercel env add SMTP_FROM production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Backend to Production
        id: deploy-backend
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "### Backend Deployment :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Frontend to Production
        id: deploy-frontend
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "### Frontend Deployment :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY
